# ============================================================
# Lagoa em Jogo - proxy reverso Nginx (Fase 17 - Deploy)
# Configuracao de HTTPS com Let's Encrypt (certbot).
#
# 1) Instale o Nginx e o Certbot:
#    sudo apt install nginx certbot python3-certbot-nginx
# 2) Copie este arquivo para /etc/nginx/sites-available/:
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/lagoa-em-jogo
# 3) Ative e emita o certificado:
#    sudo ln -s /etc/nginx/sites-available/lagoa-em-jogo /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d lagoaemjogo.com.br -d www.lagoaemjogo.com.br
#    (o certbot edita este arquivo e passa a servir HTTPS)
# ============================================================

server {
    listen 80;
    server_name lagoaemjogo.com.br www.lagoaemjogo.com.br;

    # Redirecionamento HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lagoaemjogo.com.br www.lagoaemjogo.com.br;

    # Certificados gerados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/lagoaemjogo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lagoaemjogo.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}