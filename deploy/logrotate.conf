# ============================================================
# Lagoa em Jogo - rotacao de logs (logrotate)
# Install:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/lagoa-em-jogo
# ============================================================
/var/log/lagoa-em-jogo/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}